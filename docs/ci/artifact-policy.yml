name: Artifact policy
on: [pull_request]
permissions:
  contents: read
jobs:
  changed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            benchmarks
            tests
      - name: Check changed blobs
        env:
          ARTIFACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -m benchmarks.check_artifact_policy --base "$ARTIFACT_BASE"
      - name: Check bundle integrity tools
        run: python3 -m unittest tests.test_artifacts
