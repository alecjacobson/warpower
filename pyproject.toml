[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warpower"
version = "0.1.0"
description = "3D Voronoi and power diagrams in NVIDIA Warp"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["warp-lang>=1.19,<1.20", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.10", "ruff>=0.6"]
bench = ["scipy>=1.10", "matplotlib>=3.7"]
torch = ["torch>=2.2"]
datasets = ["torch>=2.2", "gdown>=5"]

[project.urls]
Repository = "https://github.com/alecjacobson/warpower"

[tool.setuptools.packages.find]
include = ["warpower*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702", "E731"]
